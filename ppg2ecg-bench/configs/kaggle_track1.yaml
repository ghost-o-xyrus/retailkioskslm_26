# Track 1 ("as released") - the config every Kaggle kernel uses.
# Paths are rewritten at run time by kaggle/common.py (it finds the attached inputs under /kaggle/input).
output: /kaggle/working/results

eval:
  fs: 128            # common evaluation grid
  window_s: 10       # scoring window
  overlap: 0.5       # inference window overlap (stitching)
  band: [0.5, 40]    # same filter on pred and true before scoring
  fd: true
  fd_max_windows: 20 # Frechet is O(L^2): at most 20 evenly spaced windows per record
  profile_runs: 20
  n_examples: 2
  perturb_subset:    # robustness conditions run on this subset of every dataset
    max_subjects: 10
    max_seconds: 600

datasets:            # all read from the canonical cache produced by kernel k00
  - {name: bidmc,     loader: cache, root: CACHE, dataset: bidmc}
  - {name: capnobase, loader: cache, root: CACHE, dataset: capnobase}
  - {name: dalia,     loader: cache, root: CACHE, dataset: dalia}
  - {name: wesad,     loader: cache, root: CACHE, dataset: wesad}
  # Aurora-BP: in-lab ("initial") 30-s measurements only, so skin tone is not confounded
  # by ambulatory motion; <= 6 per subject keeps the run inside Kaggle's 12-h limit.
  - {name: aurora_bp, loader: cache, root: CACHE, dataset: aurora_bp, phase: initial, max_records_per_subject: 6}
  # MIMIC PERform AF (35 ICU patients, 19 AF / 16 sinus): rhythm labels; RDDM's and PPGFlowECG's "MIMIC-AFib"
  # source. Root is filled from the k03 output; the entry is dropped when k03 is not attached.
  - {name: mimic_perform_af, loader: cache, root: CACHE, dataset: mimic_perform_af}

models:
  - name: template_baseline
    track: 1
    fit_on: [capnobase]        # calibrates pulse-arrival delay; CapnoBase becomes "seen" for it
  - name: cardiogan
    label: cardiogan
    track: 1
    kwargs: {repo_codes_dir: CARDIOGAN_REPO/codes, weights_dir: CARDIOGAN_WEIGHTS, filter_output: true,
             dtype: float32, batch_size: 256}
  - name: ppgflowecg
    track: 1
    kwargs: {repo_dir: PPGFLOW_REPO, vae_ckpt: PPGFLOW_WEIGHTS/VAE-iter-40000.pth,
             flow_ckpt: PPGFLOW_WEIGHTS/checkpoint-10.pt, sampling_steps: 10, device: auto, batch_size: 64}
  - name: zhu_dct                # Zhu et al. 2019 DCT + ridge; trained once on CapnoBase (its paper's data)
    track: 1
    fit_on: [capnobase]
  # code-only models trained with their authors' recipes (k90-k93); each entry is dropped when its
  # training output is not attached
  - {name: chiu2020,   track: 1, kwargs: {trained_dir: TRAINED_CHIU2020}}
  - {name: clep_gan,   track: 1, kwargs: {trained_dir: TRAINED_CLEP_GAN}}
  - {name: p2e_wgan,   track: 1, kwargs: {trained_dir: TRAINED_P2E_WGAN}}
  - {name: yalcin2026, track: 1, kwargs: {trained_dir: TRAINED_YALCIN2026}}
  - name: rddm                   # dropped automatically when the k04 output is not attached
    track: 1
    kwargs: {repo_dir: RDDM_REPO, weights_dir: RDDM_WEIGHTS, n_steps: 10, device: auto, batch_size: 128}

perturbations:
  - {name: clean}
  - {name: gaussian, snr_db: [20, 10, 5]}
  - {name: motion, rate_per_min: 6, rel_amp: [1.0, 3.0]}
  - {name: baseline_wander, rel_amp: 1.0}
  - {name: low_rate, fs_low: 25}
  - {name: weak_pulse, ac_factor: [0.5, 0.25]}   # low-SNR proxy, NOT a skin-tone model
  - {name: time_shift, seconds: [-0.2, 0.2]}
