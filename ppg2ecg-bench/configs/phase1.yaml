# Phase 1: Track 1 ("as released") on the four CardioGAN datasets, CPU-friendly.
# Paths are examples - point them at where the data / repos live on your machine.
output: results/phase1

eval:
  fs: 128            # common evaluation grid
  window_s: 10       # scoring window
  overlap: 0.5       # inference window overlap for stitching (0 = original non-overlapping protocol)
  band: [0.5, 40]    # same filter applied to pred and true before scoring
  fd: true
  profile_runs: 30
  n_examples: 2

datasets:
  - {name: bidmc,     root: data/bidmc-ppg-and-respiration-dataset-1.0.0}
  - {name: capnobase, root: data/capnobase}
  - {name: dalia,     root: data/PPG_FieldStudy}
  - {name: wesad,     root: data/WESAD}
  - {name: aurora_bp, root: data/aurora-bp, max_records_per_subject: 10}   # Zenodo, accept DUA first

models:
  - name: template_baseline
    track: 1
    fit_on: [bidmc]           # calibrates pulse-arrival delay; BIDMC results for it are then "seen"
  - name: cardiogan
    track: 1
    kwargs:
      repo_codes_dir: third_party/ppg2ecg-cardiogan/codes
      weights_dir: weights/cardiogan
      filter_output: true
  # - name: ppgflowecg
  #   track: 1
  #   kwargs: {repo_dir: third_party/PPGFlowECG, vae_ckpt: weights/ppgflowecg/vae.pt,
  #            flow_ckpt: weights/ppgflowecg/model-10.pt, sampling_steps: 10}

perturbations:
  - {name: clean}
  - {name: gaussian, snr_db: [20, 10, 5]}
  - {name: motion, rate_per_min: 6, rel_amp: [1.0, 3.0]}
  - {name: baseline_wander, rel_amp: 1.0}
  - {name: low_rate, fs_low: 25}
  - {name: weak_pulse, ac_factor: [0.5, 0.25]}   # low-SNR proxy, NOT a skin-tone model
  - {name: time_shift, seconds: [-0.2, 0.2]}
