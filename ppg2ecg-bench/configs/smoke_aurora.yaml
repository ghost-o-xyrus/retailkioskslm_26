# first: git clone https://github.com/microsoft/aurorabp-sample-data third_party/aurorabp-sample-data
# Aurora-BP SAMPLE data (12 participants, github.com/microsoft/aurorabp-sample-data) - checks the skin-tone path.
output: results/smoke_aurora
eval: {fs: 128, window_s: 10, overlap: 0.5, band: [0.5, 40], fd: false, profile_runs: 5, n_examples: 1}
datasets:
  - {name: aurora_bp, root: third_party/aurorabp-sample-data/sample, max_records_per_subject: 6}
models:
  - {name: template_baseline, track: 1, kwargs: {pat: 0.19}}
perturbations:
  - {name: clean}
  - {name: weak_pulse, ac_factor: [0.3]}
