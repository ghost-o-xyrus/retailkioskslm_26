# Runs anywhere with numpy/scipy/pandas only - checks the whole pipeline end to end.
output: results/smoke

eval: {fs: 128, window_s: 10, overlap: 0.5, band: [0.5, 40], fd: true, profile_runs: 10, n_examples: 1}

datasets:
  - {name: synthetic, n_subjects: 3, duration: 120}

models:
  - name: template_baseline
    track: 1
    kwargs: {pat: 0.25}

perturbations:
  - {name: clean}
  - {name: gaussian, snr_db: [10]}
  - {name: time_shift, seconds: [0.1]}
