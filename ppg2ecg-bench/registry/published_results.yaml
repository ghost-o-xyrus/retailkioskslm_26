# Numbers the authors report for their own models, to compare with scripts/author_eval.py (pipeline A).
# Only values copied from a primary source are filled in; `null` = still to be copied from the paper.
rddm:
  source: "github.com/DebadityaQU/RDDM eval-logs/standard_eval_RDDM.out (authors' own run of std_eval.py)"
  window_s: 4            # Table 1; Table 2 heart rate uses 8-s windows
  metrics: {rmse: "min-max [-1,1] windows", fd: "Gaussian Frechet over windows (FID-style)", hr_mae: "bpm"}
  table1:
    wesad:            {rmse: 0.2092, fd: 3.86}
    capnobase:        {rmse: 0.1947, fd: 2.96}
    dalia:            {rmse: 0.2507, fd: 5.85}
    bidmc:            {rmse: 0.2355, fd: 6.71}
    mimic_perform_af: {rmse: 0.2229, fd: 6.75, note: "authors' 'MIMIC-AFib'; assumed to be this dataset"}
  table2_hr_mae_8s:
    wesad: 1.353
    dalia: 4.577
cardiogan:
  source: "Sarkar & Etemad, AAAI 2021, Table (RMSE, PRD, FD; HR MAE)"
  values: null
ppgflowecg:
  source: "Fang et al., arXiv 2509.19774 v2, main results table"
  values: null
